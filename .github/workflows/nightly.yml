name: Nightly sweep

# The full sweep: every simulation scenario over 10 000 seeds, in release mode, the
# only place ten thousand run (D-040: the gate runs 20, CI 100, scripts/premerge.sh
# 1000 on a developer's machine). Seeds run in parallel within each sweep, and every
# sweep's catch rates are printed into the job log (`--nocapture`). A failing seed
# leaves its trace in sim/out, which is uploaded so it can be opened in the moirae
# studio (sim/lib.rs).
#
# The sweep runs as seven jobs at once (D-064): six shards of ananke-sim's integration
# tests, balanced by their measured cost in scripts/nightly-shards.txt, and one job for
# the rest of the workspace. Each test runs whole in one job, so every assertion keeps
# the meaning it has at every tier: a sweep still sees all ten thousand of its seeds.
# As one job the sweep took 164 to 218 minutes of a 300-minute limit on Stage A's tree
# (issue #57), and Phase 3's later stages add to it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  ANANKE_SEEDS: 10000
  # The deep-levels engine sweep (sim/tests/engine.rs) runs only here.
  ANANKE_DEEP_SEEDS: 1000

jobs:
  sweep:
    name: 10 000 seeds (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A shard's tests took 27 to 39 minutes on the first sharded run (D-064); the limit is
    # there so a hung run fails the night instead of holding a runner for five hours.
    timeout-minutes: 150
    strategy:
      # A failing shard does not cancel the others: the night's result is every
      # sweep's verdict, not the first one.
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", "5", "6", "rest"]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for every shard, since they build the same release target; one
          # job saves it, so seven do not race to write the same key.
          shared-key: nightly
          save-if: ${{ matrix.shard == 'rest' }}
      - run: scripts/nightly.sh ${{ matrix.shard }}
      - name: Upload the traces of failing seeds
        # A job that reaches its limit is cancelled, not failed; its traces still upload.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: failing-traces-${{ matrix.shard }}
          path: sim/out/*.jsonl
          if-no-files-found: ignore
