[workspace]
resolver = "3"
members = ["crates/*", "sim"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pchrysostomou/ananke"
authors = ["Prodromos Chrysostomou"]

[workspace.dependencies]
# Shared dependency versions. Add an entry here and reference it from a crate with
# `name.workspace = true` (features go on the crate side).
bytes = "1.12"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
# The moirae bridge (SPEC §1.5, moirae ADR-009). Pinned by revision until moirae publishes
# them; switch to crates.io versions before the Phase 0 tag, since cargo publish refuses
# git dependencies.
moirae-sched = { git = "https://github.com/pchrysostomou/moirae", rev = "843f3acadb1cc10bf2000849cb7aff80d05d2c00" }
moirae-trace = { git = "https://github.com/pchrysostomou/moirae", rev = "843f3acadb1cc10bf2000849cb7aff80d05d2c00" }
siphasher = "1.0"
tempfile = "3.27"
tokio = { version = "1.53", default-features = false }
tracing = "0.1"

[workspace.lints.rust]
# Principle 3 (BOOTSTRAP_PROMPT.md): no unsafe outside storage. `deny` rather than
# `forbid` so that `ananke-storage` alone can opt out with `#![allow(unsafe_code)]`.
unsafe_code = "deny"
# "Prefer boring, well-documented Rust." Promoted to an error by `-D warnings` in CI.
missing_docs = "warn"

[workspace.lints.clippy]
# Determinism first (principle 1): the banned I/O paths live in clippy.toml at the
# workspace root. Denied here so a plain `cargo clippy` fails without `-D warnings`.
disallowed_methods = "deny"
disallowed_types = "deny"
