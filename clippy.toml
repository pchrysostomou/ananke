# Types whose mere presence means real I/O is happening. Catches constructors the
# method list above cannot name (`FromRawFd`, `From<std::fs::File>`, and so on).
disallowed-types = [
    # D-013: time is `ananke_env::Instant` / `WallTime`; std's types can reach the real clock.
    { path = "std::time::Instant", reason = "use `ananke_env::Instant` (DECISIONS.md D-013)" },
    { path = "std::time::SystemTime", reason = "use `ananke_env::WallTime` (DECISIONS.md D-013)" },

    # D-014: hash maps seeded from OS entropy iterate in a different order every run.
    { path = "std::collections::HashMap", reason = "iteration order is random per run; use `BTreeMap` or `ananke_env::DetHashMap` (DECISIONS.md D-014)" },
    { path = "std::collections::HashSet", reason = "iteration order is random per run; use `BTreeSet` or `ananke_env::DetHashSet` (DECISIONS.md D-014)" },
    { path = "std::hash::RandomState", reason = "seeded from OS entropy; use `ananke_env::DetState` (DECISIONS.md D-014)" },
    { path = "hashbrown::HashMap", reason = "iteration order is random per run; use `BTreeMap` or `ananke_env::DetHashMap` (DECISIONS.md D-014)", allow-invalid = true },
    { path = "hashbrown::HashSet", reason = "iteration order is random per run; use `BTreeSet` or `ananke_env::DetHashSet` (DECISIONS.md D-014)", allow-invalid = true },
