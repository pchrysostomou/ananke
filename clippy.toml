# Determinism first (BOOTSTRAP_PROMPT.md principle 1, DECISIONS.md D-003).
#
# Every path listed here is a source of non-determinism: the real clock, real disks,
# real sockets, unseeded randomness, or spawning outside the scheduler's control.
# None of them may be used anywhere in the workspace except inside the `real` module
# of `crates/ananke-env`, which opts out with
# `#![allow(clippy::disallowed_methods, clippy::disallowed_types)]`. Two further files
# in that crate carry a narrower `allow(clippy::disallowed_types)`: `time.rs` (the
# `SystemTime` edge conversions) and `collections.rs` (the `DetHashMap` aliases).
# `scripts/check-direct-io.sh` fails if any other file carries either allow.
#
# The two lints are set to `deny` in `[workspace.lints.clippy]` (Cargo.toml), so a
# violation fails a plain `cargo clippy` as well as CI. `scripts/check-direct-io.sh`
# is the textual belt-and-braces check that runs alongside it.
#
# Paths outside `std` carry `allow-invalid = true` because clippy cannot resolve them
# in crates that do not depend on the crate in question; the ban still applies
# wherever the path does resolve.

disallowed-methods = [
    # std::time — the real clock (SPEC.md §1.2)
    { path = "std::time::Instant::now", reason = "real clock; use `Clock::now` from ananke-env" },
    { path = "std::time::Instant::elapsed", reason = "reads the real clock; subtract two `Clock::now` values instead" },
    { path = "std::time::SystemTime::now", reason = "real clock; use `Clock::wall` from ananke-env" },
    { path = "std::time::SystemTime::elapsed", reason = "reads the real clock; use `Clock::wall` from ananke-env" },

